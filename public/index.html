<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dopta · Adopta un perro en la CDMX</title>
  <meta name="description" content="Catálogo digital gratuito de perros en adopción en refugios de la Ciudad de México. Conoce a las mascotas que buscan hogar y descubre cuál sería la tuya.">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="img/logo-dopta.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=15">

  <!-- Se cargan en la cabecera para aplicar el tema antes de pintar (sin parpadeo) -->
  <script src="razas.js?v=15"></script>
  <script src="app.js?v=15"></script>
</head>
<body>

  <header class="encabezado">
    <div class="encabezado__contenedor">
      <a class="logo" href="#/" aria-label="Dopta" data-logo>
        <img class="logo__imagen" src="img/logo-dopta.svg" alt="" width="58" height="52">
        <span class="logo__texto">Dopta</span>
      </a>
      <nav class="encabezado__nav" aria-label="Principal" id="nav"></nav>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer class="pie">
    <p>Dopta · Catálogo digital gratuito de animales en adopción</p>
  </footer>

  <div class="avisos" id="avisos" role="status" aria-live="assertive"></div>

  <button class="boton-tema" type="button" data-tema-boton aria-label="Cambiar a modo oscuro">
    <svg class="boton-tema__luna" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="boton-tema__sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <noscript><p class="mensaje mensaje--error">Dopta necesita JavaScript activado para funcionar.</p></noscript>
</body>
</html>
