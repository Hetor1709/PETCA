<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Dopta</title>
  <meta name="description" content="Inicia sesión en Dopta para publicar mascotas o enviar solicitudes de adopción.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/paginas.css">
  <script src="js/tema.js"></script>
  <script src="js/cargando.js" defer></script>
</head>
<body>

  <main class="cuenta">
    <a class="boton-contorno boton-contorno--icono cuenta__regresar" href="index.html" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>

    <section class="cuenta__tarjeta" aria-labelledby="titulo-login">
      <h1 class="cuenta__titulo" id="titulo-login">Iniciar Sesión</h1>
      <p class="cuenta__subtitulo">Ingresa a tu cuenta para explorar el catálogo de mascotas</p>

      <form class="formulario" action="index.html" method="post">
        <div class="campo">
          <label class="campo__etiqueta" for="correo">Email / Usuario</label>
          <input class="campo__entrada" id="correo" name="correo" type="email" placeholder="tu@email.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="contrasena">Contraseña</label>
          <input class="campo__entrada" id="contrasena" name="contrasena" type="password" placeholder="••••••••" autocomplete="current-password" minlength="8" maxlength="64" required>
        </div>

        <button class="boton-contorno" type="submit">Ingresar</button>
      </form>

      <p class="cuenta__pie">
        ¿No tienes cuenta?
        <a href="registro.html">Registrarse</a>
      </p>
    </section>
  </main>

  <footer class="pie">
    <p>Dopta · Catálogo digital gratuito de animales en adopción</p>
  </footer>

  <button class="boton-tema" type="button" data-tema-boton aria-label="Cambiar a modo oscuro">
    <svg class="boton-tema__luna" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="boton-tema__sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

</body>
</html>
