<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro · Dopta</title>
  <meta name="description" content="Crea tu cuenta en Dopta para adoptar o publicar mascotas en adopción.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/paginas.css">
  <script src="js/tema.js"></script>
  <script src="js/cargando.js" defer></script>
</head>
<body>

  <main class="cuenta">
    <a class="boton-contorno boton-contorno--icono cuenta__regresar" href="index.html" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>

    <section class="cuenta__tarjeta" aria-labelledby="titulo-registro">
      <h1 class="cuenta__titulo" id="titulo-registro">Registro</h1>

      <form class="formulario" action="index.html" method="post">
        <div class="campo">
          <label class="campo__etiqueta" for="nombre">Nombre completo</label>
          <input class="campo__entrada" id="nombre" name="nombre" type="text" placeholder="Tu nombre completo" autocomplete="name" minlength="2" maxlength="100" required>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="correo">Email</label>
          <input class="campo__entrada" id="correo" name="correo" type="email" placeholder="tu@email.com" autocomplete="email" maxlength="254" required>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="contrasena">Contraseña</label>
          <input class="campo__entrada" id="contrasena" name="contrasena" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" maxlength="64" required>
          <span class="campo__ayuda">De 8 a 64 caracteres, con al menos una letra y un número.</span>
        </div>

        <div class="campo">
          <label class="campo__etiqueta" for="confirmar">Confirmar contraseña</label>
          <input class="campo__entrada" id="confirmar" name="confirmar" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" maxlength="64" required>
        </div>

        <fieldset class="campo campo--tipo">
          <legend class="campo__etiqueta">Tienes un registro</legend>
          <div class="pregunta__opciones">
            <label class="opcion">
              <input type="radio" name="tipo" value="adoptante" required>
              <span class="opcion__texto">Adoptante</span>
            </label>
            <label class="opcion">
              <input type="radio" name="tipo" value="refugio">
              <span class="opcion__texto">Refugio</span>
            </label>
          </div>
        </fieldset>

        <label class="campo campo--casilla">
          <input type="checkbox" name="privacidad" required>
          <span>Acepto el <a href="#aviso-privacidad">aviso de privacidad</a></span>
        </label>

        <button class="boton-contorno" type="submit">Registrarse</button>
      </form>

      <p class="cuenta__pie">
        ¿Ya tienes cuenta?
        <a href="login.html">Iniciar Sesión</a>
      </p>
    </section>
  </main>

  <footer class="pie">
    <p>Dopta · Catálogo digital gratuito de animales en adopción</p>
  </footer>

  <button class="boton-tema" type="button" data-tema-boton aria-label="Cambiar a modo oscuro">
    <svg class="boton-tema__luna" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="boton-tema__sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</body>
</html>
